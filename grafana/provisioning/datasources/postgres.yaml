apiVersion: 1

datasources:
  - name: Canvasly Postgres
    type: postgres
    uid: canvasly-postgres
    url: postgres:5432
    database: canvasly
    user: canvasly
    secureJsonData:
      password: canvasly_dev
    jsonData:
      sslmode: disable
      maxOpenConns: 5
      maxIdleConns: 2
      connMaxLifetime: 14400
      postgresVersion: 1600
      timescaledb: false
    isDefault: true
    editable: true
